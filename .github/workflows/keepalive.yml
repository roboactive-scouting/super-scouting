name: Keep-alive

# SPEC-FINAL 19.6: exactly one scheduled job in v1. No Vercel Cron, no background
# jobs, no database-side scheduling. Daily, not twice a week: production was paused
# on 2026-10-05, four days after a green run, so the ~7-day idle rule is not the
# whole story. Daily keeps it active and tells us within a day when it goes down.
on:
  schedule:
    - cron: '17 5 * * *' # daily 05:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: dev
            secret: HEALTHCHECK_DEV_URL
          - name: production
            secret: HEALTHCHECK_PROD_URL
    steps:
      - name: Ping ${{ matrix.target.name }}
        env:
          URL: ${{ secrets[matrix.target.secret] }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::${{ matrix.target.secret }} is not set (docs/ops/ENVIRONMENT.md §3)"
            exit 1
          fi
          body=$(curl --fail-with-body --silent --show-error --max-time 30 "$URL")
          echo "$body"
          echo "$body" | grep -q '"database":"ok"'

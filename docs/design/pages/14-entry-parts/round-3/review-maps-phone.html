const P = PX;
const behind = P.head({ team: '2630 Thunderbolts', meta: 'Draft saved on this device · 11:45' }) + P.tabs(3, 3) + `<div class="pane">${P.phead('Notes', 4)}${P.stars('Driver skill', 4)}</div>`;

const f2 = P.screen({ time: '11:45', body: behind, bar: false, over: RV.sheet('tele') });

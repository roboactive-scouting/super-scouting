<div class="canvas">
  <div class="canvas-head"><b>Switch scouter — final · phone</b><span>Nobody chosen yet, a person chosen (what stays on the device), a wrong password while offline, and a device with no accounts yet.</span></div>
  <div class="frames">
    <figure class="frame"><div class="phone"><div data-phone-shell data-time="11:47" data-title="Switch scouter">
      <div class="swp">
        <div class="swh1">Switch scouter</div>
        <div class="swsub">Entries already on this device keep the scouter who made them.</div>
        <div class="now"><span class="av3">NL</span><div><small>Scouting now</small><b>Noa Levi</b></div></div>
        <div class="fld"><label>Who's scouting next?</label><div class="sel56"><span class="ph">Choose who is scouting</span><i data-i="down"></i></div></div>
        <div class="sbtn">Switch scouter</div>
        <div class="ghost">Cancel</div>
      </div>
    </div></div><figcaption>1 · Nobody chosen yet</figcaption></figure>

    <figure class="frame"><div class="phone"><div data-phone-shell data-time="11:47" data-title="Switch scouter">
      <div class="swp">
        <div class="swh1">Switch scouter</div>
        <div class="swsub">Entries already on this device keep the scouter who made them.</div>
        <div class="now"><span class="av3">NL</span><div><small>Scouting now</small><b>Noa Levi</b></div></div>
        <div class="fld"><label>Who's scouting next?</label><div class="sel56">Amit Ben-David <span class="u">· amit.bd</span><i data-i="down"></i></div></div>
        <div class="fld"><label>Password for Amit Ben-David</label><div class="inp focus"><span class="dots">•••••</span><span class="caret" style="margin-left:0"></span><span class="eye"><i data-i="eye"></i></span></div></div>
        <div class="keep"><i data-i="info"></i><span><b>Stays on this device:</b> Noa's 3 entries waiting to send, which still send as Noa's, and station <b>Blue 2</b>.</span></div>
        <div class="sbtn">Switch scouter</div>
        <div class="ghost">Cancel</div>
      </div>
    </div></div><figcaption>2 · Chosen: what stays</figcaption></figure>

    <figure class="frame"><div class="phone"><div data-phone-shell data-time="11:48" data-title="Switch scouter" data-sync="<span class='dot w'></span>Offline">
      <div class="swp">
        <div class="swh1">Switch scouter</div>
        <div class="swsub">Entries already on this device keep the scouter who made them.</div>
        <div class="now"><span class="av3">NL</span><div><small>Scouting now</small><b>Noa Levi</b></div></div>

        <div class="fld"><label>Password for Amit Ben-David</label><div class="inp focus"><span class="caret" style="margin-left:0"></span><span class="eye"><i data-i="eye"></i></span></div></div>
        <div class="msg err"><i data-i="alert"></i><span>That username and password do not match.</span></div>
        <div class="sbtn">Switch scouter</div>
        <div class="ghost">Cancel</div>
      </div>
    </div></div><figcaption>3 · Wrong password (cleared), offline</figcaption></figure>

    <figure class="frame"><div class="phone"><div data-phone-shell data-time="07:58" data-title="Switch scouter" data-sync="<span class='dot w'></span>Offline">
      <div class="swp">
        <div class="swh1">Switch scouter</div>
        <div class="msg note"><i data-i="off"></i><span>This device has not loaded the team's accounts yet. Connect to the internet once to sign in.</span></div>
        <div class="ghost">Cancel</div>
      </div>
    </div></div><figcaption>4 · No accounts on this device yet</figcaption></figure>
  </div>
</div>

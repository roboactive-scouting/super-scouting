<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Delete — A</title>
    <link rel="stylesheet" href="../../../theme.css" />
    <link rel="stylesheet" href="../../shell.css" />
    <link rel="stylesheet" href="a/a.css" />
  </head>
  <body>
    <div class="canvas">
      <div class="canvas-head">
        <b>Delete — A · The bill comes first</b>
        <span>Every confirmation opens on a dark band that itemises what goes, one square per entry; the name, the backup and the buttons come after it.</span>
      </div>

      <!-- Row 1 -->
      <div class="frames">
        <figure class="frame">
          <div class="desk">
            <div data-desk-shell="manage" data-nav="stats" data-crumb="Manage / <b>Competitions</b>">
              <div class="a-page">
                <h1>Manage</h1>
                <div class="a-tabs"><span class="on">Competitions</span><span>Forms</span></div>
                <div class="a-card">
                  <div class="a-row"><div><b>Season 2026</b><br /><small>2 events · active season</small></div><span class="sp"></span><span class="tag ok">Active</span></div>
                  <div class="a-row"><div><b>Season 2025</b><br /><small>3 events · 246 matches</small></div><span class="sp"></span><span class="btn">Delete season</span></div>
                </div>
              </div>
            </div>
            <div class="a-scrim">
              <div class="a-dlg">
                <div class="a-bill">
                  <div class="a-kick">
                    <svg viewBox="0 0 24 24"><path d="M12 3 2 21h20zM12 10v5M12 18h.01" /></svg>
                    Delete Season 2025 · hard delete · cannot be undone
                    <span class="sp"></span>
                    <small>Counted on the server just now<span class="new">NEW</span></small>
                  </div>
                  <div class="a-bill-body">
                    <div>
                      <div class="a-big"><span class="num">1,912</span><span>entries go</span></div>
                      <p class="a-sub">with <b>246 matches</b> at <b>3 events</b>, and every form, dashboard and preset Season 2025 holds.</p>
                      <div class="a-field" data-field="1912,108"></div>
                      <div class="a-legend">
                        <span><i></i>1,804 match entries</span><span><i class="s"></i>108 super entries</span>
                        <span>One square per entry<span class="new">NEW</span></span>
                      </div>
                    </div>
                    <div class="a-items">
                      <div><span class="num">3</span><b>events</b><small>ISR District #1 · ISR District #4 · ISR District Championship</small></div>
                      <div><span class="num">246</span><b>matches</b></div>
                      <div><span class="num">1,912</span><b>entries</b><small>1,804 match · 108 super</small></div>
                      <div><span class="num">2</span><b>forms</b><small>7 versions in all</small></div>
                      <div><span class="num">4</span><b>dashboards</b></div>
                      <div><span class="num">2</span><b>weight presets</b></div>
                      <div><span></span><span class="dim">and every metric defined for the season</span></div>
                    </div>
                  </div>
                </div>
                <div class="a-act">
                  <h2>Delete Season 2025?</h2>
                  <p>The rows are removed from the database for good. Only a backup you take now can bring them back.</p>
                  <div class="a-steps">
                    <div class="a-step">
                      <h3><span class="n">1</span>Back up first</h3>
                      <p>Run this in a terminal on your computer. The app can't run it for you.</p>
                      <div class="a-cmd"><code>supabase db dump</code><span class="btn">Copy</span></div>
                    </div>
                    <div class="a-step">
                      <h3><span class="n">2</span>Type the season's name</h3>
                      <div class="a-input">202<span class="caret"></span><span class="state">No match yet</span></div>
                      <p class="hint">Type <b>2025</b> exactly, including case. The delete button stays off until it matches.</p>
                    </div>
                  </div>
                  <div class="a-foot">
                    <span class="note">Admins only · Online, so the delete runs on the server at once.</span>
                    <span class="btn">Cancel</span>
                    <button class="btn a-del" disabled>Delete season 2025</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <figcaption>1 · Desktop, Manage › Competitions: delete Season 2025. Type-to-confirm with "202" typed, button still off. Cancel had focus when it opened.</figcaption>
        </figure>

        <figure class="frame">
          <div class="phone">
            <div data-phone-shell data-title="Entry" data-bbar="none" data-time="13:20">
              <div class="a-page" style="padding: 18px 16px">
                <h1 class="num" style="font-size: 22px">Q12 · 2096</h1>
                <p style="color: var(--muted); margin-top: 4px">RoboActive · Red 2 · Yael Shapira</p>
                <div class="a-card" style="margin-top: 16px; height: 220px"></div>
              </div>
            </div>
            <div class="a-pscrim">
              <div class="a-sheet">
                <div class="a-bill">
                  <div class="a-grab"></div>
                  <div class="a-kick">Delete entry · soft delete</div>
                  <div class="a-big" style="margin-top: 10px"><span class="num">1</span><span>entry stops counting</span></div>
                  <div class="a-ecard">
                    <b class="num">Q12 · 2096</b>
                    <span class="pts num">47<small>points</small></span>
                    <span class="meta"><span class="tag red">Red 2</span>RoboActive</span>
                    <span></span>
                    <span class="meta">Yael Shapira · <span class="num">11:02</span></span>
                  </div>
                  <div class="a-leaves"><span>Statistics</span><span>Entry lists</span><span>Ranking</span></div>
                </div>
                <div class="a-pact">
                  <h2>Delete Q12 · 2096 RoboActive?</h2>
                  <p>It leaves all three once it syncs. The row is kept, but there is no restore in this version.</p>
                  <div class="a-pbtns">
                    <span class="btn a-del">Delete entry Q12 · 2096</span>
                    <span class="btn a-focus">Cancel</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <figcaption>Phone 1 · a lead deletes one entry. Plain confirm; Cancel focused, nearest the thumb.</figcaption>
        </figure>
      </div>

      <!-- Row 2 -->
      <div class="frames">
        <figure class="frame">
          <div class="desk">
            <div data-desk-shell="manage" data-nav="stats" data-crumb="Manage / Forms / <b>Match form 2026</b>">
              <div class="a-page">
                <h1>Match form 2026</h1>
                <div class="a-tabs"><span>Builder</span><span class="on">Versions</span></div>
                <div class="a-card">
                  <div class="a-row"><div><b>Version 2</b><br /><small>Published 09/03/2026</small></div><span class="sp"></span><span class="tag ok">Current</span></div>
                  <div class="a-row"><div><b>Version 1</b><br /><small>02/03/2026 – 09/03/2026 · 312 entries</small></div><span class="sp"></span><span class="btn">Delete version</span></div>
                </div>
              </div>
            </div>
            <div class="a-scrim">
              <div class="a-dlg narrow">
                <div class="a-bill blocked">
                  <div class="a-kick">
                    <span class="a-tag-blk"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M5.6 5.6l12.8 12.8" /></svg>Blocked</span>
                    Delete version 1 of Match form 2026
                  </div>
                  <div class="a-bill-body" style="grid-template-columns: 1fr 280px">
                    <div>
                      <div class="a-big"><span class="num">312</span><span>entries are bound to it</span></div>
                      <p class="a-sub">Deleting the version would leave them with no form to read them by.</p>
                      <div class="a-field" data-field="312,0"></div>
                    </div>
                    <div class="a-items">
                      <div><span class="num">v1</span><b>Match form 2026</b></div>
                      <div><span class="num">02/03</span><b>published</b><small>2026</small></div>
                      <div><span class="num">09/03</span><b>replaced by v2</b><small>2026</small></div>
                    </div>
                  </div>
                </div>
                <div class="a-act">
                  <h2>Version 1 can't be deleted</h2>
                  <p>It still holds collected data, so there is nothing to confirm here. Pick a way forward.</p>
                  <div class="a-ways">
                    <div class="a-way">
                      <h3>Keep version 1</h3>
                      <p>Nothing changes. The 312 entries keep their version.</p>
                      <span class="btn a-focus">Keep version 1</span>
                    </div>
                    <div class="a-way">
                      <h3>Delete the whole form instead</h3>
                      <p>Takes Match form 2026, every version and every entry bound to it, these 312 included. You confirm it on its own bill, by typing the form's name.</p>
                      <span class="btn">Delete the whole form…</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <figcaption>2 · Desktop, form builder: version 1 has entries, so the delete is refused. No confirm control, nothing to type.</figcaption>
        </figure>

        <figure class="frame">
          <div class="phone">
            <div data-phone-shell data-title="Manage" data-bbar="none" data-time="13:20">
              <div class="a-page" style="padding: 18px 16px">
                <h1 style="font-size: 20px">ISR District Event #3</h1>
                <div class="a-card" style="margin-top: 14px">
                  <div class="a-row"><b class="num">Q40</b><span class="sp"></span><small>6 entries</small></div>
                  <div class="a-row"><b class="num">Q41</b><span class="sp"></span><small>6 entries</small></div>
                  <div class="a-row"><b class="num">Q42</b><span class="sp"></span><small>4 entries</small></div>
                </div>
              </div>
            </div>
            <div class="a-pscrim">
              <div class="a-sheet">
                <div class="a-bill blocked">
                  <div class="a-grab"></div>
                  <div class="a-kick">
                    <span class="a-tag-blk"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M5.6 5.6l12.8 12.8" /></svg>Blocked</span>
                    Delete match Q41
                  </div>
                  <div class="a-big" style="margin-top: 10px"><span class="num">6</span><span>entries are saved to Q41</span></div>
                  <p class="a-sub">Deleting the match would leave them with no match. Last saved <b class="num">13:18</b>.</p>
                  <p class="a-sub" style="margin-top:12px;font-size:12.5px">Its entries, one per robot<span class="new">NEW</span></p>
                  <div class="a-six">
                    <span class="r">Red 1<small>saved</small></span><span class="r">Red 2<small>saved</small></span><span class="r">Red 3<small>saved</small></span>
                    <span class="b">Blue 1<small>saved</small></span><span class="b">Blue 2<small>saved</small></span><span class="b">Blue 3<small>saved</small></span>
                  </div>
                </div>
                <div class="a-pact">
                  <h2>Q41 can't be deleted</h2>
                  <p>Fix it one of these ways instead.</p>
                  <div class="a-pbtns">
                    <span class="btn primary">Correct the match number</span>
                    <span class="btn">Delete its 6 entries first</span>
                    <span class="btn a-focus">Close</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <figcaption>Phone 2 · match Q41 has entries: refused, with two ways forward.</figcaption>
        </figure>
      </div>
    </div>
    <script src="../../shell.js"></script>
    <script src="a/a.js"></script>
  </body>
</html>

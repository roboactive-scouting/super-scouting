<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Delete — final, phone</title>
<link rel="stylesheet" href="../../../theme.css"><link rel="stylesheet" href="../../shell.css"><link rel="stylesheet" href="../src/a/a.css"><link rel="stylesheet" href="../src/final.css">
<style>.canvas{height:940px}</style>
</head><body>
<div class="canvas">
  <div class="canvas-head"><b>Delete — final · phone</b><span>Variant A: the bill comes first. One record with nothing to type is a plain "Are you sure?"; a match with entries can go with them, backed up and typed.</span></div>
  <div class="frames">
    <figure class="frame">
      <div class="phone">
        <div data-phone-shell data-title="Entry" data-bbar="none" data-time="13:20">
          <div class="a-page" style="padding: 18px 16px"><h1 class="num" style="font-size: 22px">Q12 · 2096</h1><p style="color: var(--muted); margin-top: 4px">RoboActive · Red 2 · Yael Shapira</p><div class="a-card" style="margin-top: 16px; height: 220px"></div></div>
        </div>
        <div class="f-pscrim">
          <div class="f-pop" role="alertdialog" aria-label="Are you sure?">
            <h2>Are you sure?</h2>
            <div class="f-obj"><b>Q12 · 2096</b><span class="pts">47<small>points</small></span><span><span class="tag red">Red 2</span> RoboActive · Yael Shapira · <span class="num">11:02</span></span></div>
            <p>This deletes <b>1 entry</b>. It stops counting in statistics, lists and ranking once it syncs. There is no restore.</p>
            <div class="f-pop-btns"><span class="btn a-focus">Cancel</span><span class="btn a-del">Delete entry</span></div>
          </div>
        </div>
      </div>
      <figcaption>1 · One entry: "Are you sure?", nothing to type</figcaption>
    </figure>
    <figure class="frame">
      <div class="phone">
        <div data-phone-shell data-title="Manage" data-bbar="none" data-time="13:20">
          <div class="a-page" style="padding: 18px 16px"><h1 style="font-size: 20px">ISR District Event #3</h1><div class="a-card" style="margin-top: 14px"><div class="a-row"><b class="num">Q40</b><span class="sp"></span><small>6 entries</small></div><div class="a-row"><b class="num">Q41</b><span class="sp"></span><small>6 entries</small></div><div class="a-row"><b class="num">Q42</b><span class="sp"></span><small>4 entries</small></div></div></div>
        </div>
        <div class="a-pscrim">
          <div class="a-sheet">
            <div class="a-bill blocked">
              <div class="a-grab"></div>
              <div class="a-kick">Delete match Q41</div>
              <div class="a-big" style="margin-top: 10px"><span class="num">6</span><span>entries are saved to Q41</span></div>
              <p class="a-sub">The match can't go on its own: it would leave them with no match. Last saved <b class="num">13:18</b>.</p>
              <div class="a-six"><span class="r">Red 1<small>saved</small></span><span class="r">Red 2<small>saved</small></span><span class="r">Red 3<small>saved</small></span><span class="b">Blue 1<small>saved</small></span><span class="b">Blue 2<small>saved</small></span><span class="b">Blue 3<small>saved</small></span></div>
            </div>
            <div class="a-pact">
              <h2>Q41 has entries</h2>
              <p>Correct its number, or delete it together with its entries.</p>
              <div class="a-pbtns">
                <span class="btn primary">Correct the match number</span>
                <span class="btn">Delete Q41 and its 6 entries…</span>
                <span class="btn a-focus">Close</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <figcaption>2 · Q41 has entries: correct it, or delete it with them</figcaption>
    </figure>
    <figure class="frame">
      <div class="phone">
        <div data-phone-shell data-title="Manage" data-bbar="none" data-time="13:21">
          <div class="a-page" style="padding: 18px 16px"><h1 style="font-size: 20px">ISR District Event #3</h1><div class="a-card" style="margin-top: 14px"><div class="a-row"><b class="num">Q40</b><span class="sp"></span><small>6 entries</small></div><div class="a-row"><b class="num">Q41</b><span class="sp"></span><small>6 entries</small></div><div class="a-row"><b class="num">Q42</b><span class="sp"></span><small>4 entries</small></div></div></div>
        </div>
        <div class="a-pscrim">
          <div class="a-sheet">
            <div class="a-bill">
              <div class="a-grab"></div>
              <div class="a-kick">Delete Q41 and its entries · cannot be undone</div>
              <div class="a-big" style="margin-top: 10px"><span class="num">6</span><span>entries go, with Q41</span></div>
              <p class="a-sub">Red 1–3 and Blue 1–3, ISR District Event #3. Counted on the server just now.</p>
            </div>
            <div class="a-pact" style="padding-top: 14px">
              <div class="f-psteps">
                <div class="a-step"><h3><span class="n">1</span>Back up first</h3><div class="f-cmd"><div class="f-cmd-h">On your computer · SETUP.md › Backup<span class="sp"></span><span class="btn">Copy both</span></div><pre>pnpm --filter @frc/db exec supabase db dump -f ~/frc-backups/prod-schema-$(date +%Y-%m-%d).backup.sql
pnpm --filter @frc/db exec supabase db dump --data-only --use-copy -f ~/frc-backups/prod-data-$(date +%Y-%m-%d).backup.sql</pre></div></div>
                <div class="a-step"><h3><span class="n">2</span>Type <span class="num">&nbsp;Q41</span></h3><div class="a-input">Q4<span class="caret"></span><span class="state">No match yet</span></div></div>
              </div>
              <div class="f-pop-btns"><span class="btn a-focus">Cancel</span><button class="btn a-del" disabled>Delete Q41</button></div>
            </div>
          </div>
        </div>
      </div>
      <figcaption>3 · Q41 with its entries: back up, then type Q41</figcaption>
    </figure>
  </div>
</div>
<script src="../../shell.js"></script>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Entry — final, phone</title>
<link rel="stylesheet" href="../../../theme.css"><link rel="stylesheet" href="../../shell.css"><link rel="stylesheet" href="../src/entry.css"><link rel="stylesheet" href="final.css">
<style>
.canvas{height:940px}
.frames{gap:18px}
.phone{zoom:.88}
.ehead{padding:10px 16px 12px}
.pane{padding:0 16px}
.slide{position:absolute;inset:0;display:flex;overflow:hidden}
.slide .pg{flex:none;width:100%;padding:0 16px;background:var(--bg)}
.slide .pg + .pg{border-left:1px solid var(--line)}
.arrow{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-weight:650;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px -6px rgba(0,0,0,.4)}
.hand{position:absolute;top:52%;right:70px;width:46px;height:46px;border-radius:50%;background:rgba(20,24,32,.18);border:2px solid rgba(20,24,32,.35)}
</style></head><body>
<div class="canvas">
  <div class="canvas-head"><b>Entry — final · phone</b><span>Variant B. Swipe left or right on the phase area to change phase; the tab, the phase title and the dots always show where you are.</span></div>
  <div class="frames">

    <figure class="frame"><div class="phone"><div data-phone-shell data-time="11:43">
      <div class="ehead"><div class="row"><span class="back">‹ Scout</span><span class="tag red">Red 1</span></div><h1><span class="num">Q39</span> · 1690 Orbit</h1><div class="meta"><span class="dot"></span>Draft saved on this device · 11:43</div></div>
      <div style="padding:12px 16px"><div class="lbl">Robot status</div><div class="pS"></div></div>
      <div class="ptabs t2"></div>
      <div class="pane"><div class="phead"><b>Teleop</b><span class="pos">Phase 2 of 4</span><span class="dots"><i class="done"></i><i class="on"></i><i></i><i></i></span></div><div class="teleop"></div>
        <div class="swipe"><span>‹ <b>Auto</b></span><span>swipe to change phase</span><span><b>Endgame</b> ›</span></div></div>
      <div class="ebar"><a class="btn primary block">Review entry</a></div>
    </div></div><figcaption>1 · Form, Teleop phase</figcaption></figure>

    <figure class="frame"><div class="phone"><div data-phone-shell data-time="11:43">
      <div class="ehead"><div class="row"><span class="back">‹ Scout</span><span class="tag red">Red 1</span></div><h1><span class="num">Q39</span> · 1690 Orbit</h1><div class="meta"><span class="dot"></span>Draft saved on this device · 11:43</div></div>
      <div style="padding:12px 16px"><div class="lbl">Robot status</div><div class="pS"></div></div>
      <div class="ptabs t3"></div>
      <div style="position:relative;height:420px">
        <div class="slide" style="transform:translateX(-30%);width:200%;inset:0 auto 0 0">
          <div class="pg" style="width:50%"><div class="phead"><b>Teleop</b><span class="pos">Phase 2 of 4</span></div><div class="teleop"></div></div>
          <div class="pg" style="width:50%"><div class="phead"><b>Endgame</b><span class="pos">Phase 3 of 4</span><span class="dots"><i class="done"></i><i class="done"></i><i class="on"></i><i></i></span></div><div class="endgame"></div></div>
        </div>
        <div class="hand"></div>
        <div class="arrow">← swiping to Endgame</div>
      </div>
      <div class="ebar"><a class="btn primary block">Review entry</a></div>
    </div></div><figcaption>2 · Mid-swipe: the tab moves with the page</figcaption></figure>

    <figure class="frame"><div class="phone"><div data-phone-shell data-time="11:47">
      <div class="ehead"><div class="row"><span class="back">‹ Scout</span><span class="tag blue">Blue 2</span></div><h1><span class="num">Q40</span> · 3316 D-Bug</h1><div class="meta"><span class="dot"></span>Draft saved on this device · 11:47</div></div>
      <div style="padding:12px 16px"><div class="lbl">Robot status</div><div class="pSb"></div>
        <div class="lbl" style="margin-top:14px">Breakdown time (seconds from match start)</div><div class="numin"><span class="num">74</span><span>s</span></div></div>
      <div class="ptabs t1"></div>
      <div class="pane"><div class="phead"><b>Autonomous</b><span class="pos">Phase 1 of 4</span><span class="dots"><i class="on"></i><i></i><i></i><i></i></span></div><div class="auto"></div></div>
      <div class="ebar"><a class="btn primary block">Review entry</a></div>
    </div></div><figcaption>3 · Broke down: breakdown time appears</figcaption></figure>

    <figure class="frame"><div class="phone"><div data-phone-shell data-time="11:51">
      <div class="ehead"><div class="row"><span class="back">‹ Scout</span><span class="tag blue">Blue 2</span></div><h1><span class="num">Q41</span> · 3339 BumbleB</h1><div class="meta"><span class="dot"></span>Draft saved on this device · 11:51</div></div>
      <div style="padding:12px 16px"><div class="lbl">Robot status</div><div class="pSn"></div>
        <div class="note" style="margin-top:14px"><b>Status only.</b> No fields are recorded for a no-show robot, so its averages are never pulled down by zeros.</div></div>
      <div class="ebar"><a class="btn primary block">Review entry</a></div>
    </div></div><figcaption>4 · No show (or Disabled): no phases</figcaption></figure>

    <figure class="frame"><div class="phone"><div data-phone-shell data-time="11:45">
      <div class="ehead"><div class="row"><span class="back">‹ Scout</span><span class="tag red">Red 1</span></div><h1><span class="num">Q39</span> · 1690 Orbit</h1></div>
      <div class="scrim"></div>
      <div class="sheet"><div class="grab"></div>
        <div style="font-size:20px;font-weight:750;letter-spacing:-.01em">Confirm this entry</div>
        <div style="color:var(--muted);font-size:13px;margin:4px 0 12px">You can still edit it for 10 minutes after submitting.</div>
        <div class="sum" style="overflow:hidden;max-height:470px"><div class="sr"><span>Status</span><b>Played</b></div><div class="conf"></div></div>
        <div style="display:flex;gap:10px;padding:12px 0 26px"><a class="btn" style="flex:1;height:52px">Keep editing</a><a class="btn primary" style="flex:1;height:52px">Submit entry</a></div>
      </div>
    </div></div><figcaption>5 · Confirm: a bottom sheet</figcaption></figure>

  </div>
</div>
<script src="../src/entry.js"></script><script src="../../shell.js"></script>
<script>
const tick='<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';
const tabs=(cur,done)=>['Auto','Teleop','Endgame','Notes'].map((t,i)=>`<span class="${i===cur?'on':i<done?'done':''}">${i<done&&i!==cur?tick:''}${t}</span>`).join('');
const set=(sel,html)=>document.querySelectorAll(sel).forEach(e=>e.innerHTML=html);
set('.pS',E.status('seg'));
set('.pSb',E.status('seg','broke'));
set('.pSn',E.status('seg','noshow'));
set('.t1',tabs(0,0)); set('.t2',tabs(1,1));
set('.t3',tabs(2,2).replace('<span class="on">Endgame','<span class="on" style="background:linear-gradient(90deg,var(--accent-tint) 60%,transparent)">Endgame'));
set('.teleop',E.phase(E.PHASES[1],{counter:'row'}));
set('.endgame',E.phase(E.PHASES[2]));
set('.auto',E.phase(E.PHASES[0],{counter:'row'}));
set('.conf',E.summaryRows(true));
</script>
</body></html>

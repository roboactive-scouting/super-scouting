<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Change password — final, phone</title>
<link rel="stylesheet" href="../../../theme.css"><link rel="stylesheet" href="../../shell.css"><link rel="stylesheet" href="../../04-login/src/login.css"><link rel="stylesheet" href="../../04-login/src/a.css"><link rel="stylesheet" href="../src/pw.css">
<style>.canvas{height:940px}.frames{gap:22px}.phone{zoom:.84}</style>
</head><body>
<div class="canvas">
  <div class="canvas-head"><b>Change password — final · phone</b><span>Forced after sign-in (rules met), a mismatch caught while typing, offline, and changing.</span></div>
  <div class="frames">
    
    <figure class="frame"><div class="phone">
      <div class="lsb dark"><span>08:41</span><span style="font-size:11px">● ● ●</span></div>
      <div class="a-band small"><img src="../../../../brand/logo.png" alt=""></div>
      <div class="a-pbody" id="p1"></div>
    </div><figcaption>Phone · forced, rules met</figcaption></figure>

    <figure class="frame"><div class="phone">
      <div class="lsb dark"><span>12:10</span><span style="font-size:11px">● ● ●</span></div>
      <div class="a-band small"><img src="../../../../brand/logo.png" alt=""></div>
      <div class="a-pbody" id="p2"></div>
    </div><figcaption>Phone · offline</figcaption></figure>
    <figure class="frame"><div class="phone">
      <div class="lsb dark"><span>12:10</span><span style="font-size:11px">● ● ●</span></div>
      <div class="a-band small"><img src="../../../../brand/logo.png" alt=""></div>
      <div class="a-pbody" id="p3"></div>
    </div><figcaption>Phone · mismatch while typing</figcaption></figure>

    <figure class="frame"><div class="phone">
      <div class="lsb dark"><span>08:42</span><span style="font-size:11px">● ● ●</span></div>
      <div class="a-band small"><img src="../../../../brand/logo.png" alt=""></div>
      <div class="a-pbody" id="p4"></div>
    </div><figcaption>Phone · changing</figcaption></figure>
  </div>
</div>
<script src="../src/pw.js"></script>
<script>
const ck = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>';
const x = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const rules = (a, b) => `<div class="rules"><span class="${a}"><i>${a === 'ok' ? ck : ''}</i>At least 8 characters</span><span class="${b}"><i>${b === 'ok' ? ck : b === 'no' ? x : ''}</i>Both new passwords match</span></div>`;
// desktop omitted
// = PW.volHead + PW.form({ nw: '••••••••••', cf: '•••••••', rules: rules('ok', 'no'), back: 1 });
document.getElementById('p1').innerHTML = PW.forcedHead + PW.form({ nw: '••••••••••', cf: '••••••••••', rules: rules('ok', 'ok') });
document.getElementById('p2').innerHTML = PW.volHead + '<div class="msg note"><i data-i="off"></i><span>No connection. Changing your password needs the server — try again when this device is online.</span></div>' + PW.form({ rules: rules('', '') }).replace('class="sbtn ', 'style="opacity:.45" class="sbtn ') + '<div class="ghost2">Back to scouting</div>';
document.getElementById('p3').innerHTML = PW.volHead + PW.form({ nw: '••••••••••', cf: '•••••••', rules: rules('ok', 'no'), back: 1 });
document.getElementById('p4').innerHTML = PW.forcedHead + PW.form({ nw: '••••••••••', cf: '••••••••••', rules: rules('ok', 'ok'), busy: 1 });
</script>
<script src="../../04-login/src/login.js"></script>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Change password — final, the account corner</title>
<link rel="stylesheet" href="../../../theme.css"><link rel="stylesheet" href="../../shell.css"><link rel="stylesheet" href="../src/pw.css">
<style>body{background:var(--bg)}.desk.final{zoom:1;border-radius:0;box-shadow:none}.bgp{padding:24px 32px;display:flex;flex-direction:column;gap:14px}
.acctmenu{bottom:84px;width:204px}.acctmenu div{display:flex;align-items:center;gap:9px}.acctmenu svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;color:var(--muted)}.acctmenu div.on svg{color:var(--accent-ink)}.acctmenu hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}</style>
</head><body>
<div class="desk final"><div data-desk-shell="home" data-crumb="<b>Home</b>">
  <div class="bgp"><div class="bgcard" style="height:90px"></div><div class="bgcard" style="height:180px"></div><div class="bgcard" style="height:200px"></div></div>
</div></div>
<script src="../../shell.js"></script>
<script>
const s = (p) => `<svg viewBox="0 0 24 24">${p}</svg>`;
const side = document.querySelector('.side');
side.style.position = 'relative';
side.insertAdjacentHTML('beforeend', `<div class="acctmenu">
  <div>${s('<path d="M7 7h11l-3-3M17 17H6l3 3"/>')}Switch scouter</div>
  <div class="on">${s('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>')}Change password</div>
  <hr><div>${s('<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>')}Sign out</div></div>`);
const foot = document.querySelector('.side .foot');
foot.style.background = 'var(--rail-raised)'; foot.style.borderRadius = '8px'; foot.style.padding = '10px 8px';
</script>
</body></html>
